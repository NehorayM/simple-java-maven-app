name: Pipeline 2 AWS ECR Local Deploy

on:
  push:
    branches: ["AWS-Infrastructure"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate and Set Version
        id: version
        run: |
          NEW_VERSION="1.0.$(( ${{ github.run_number }} - 1 ))"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          mvn versions:set -DnewVersion="${NEW_VERSION}" -DgenerateBackupPoms=false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ steps.version.outputs.version }}
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Deploy Container from ECR
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ steps.version.outputs.version }}"
          CONTAINER_NAME="my-app-service"
          docker stop ${CONTAINER_NAME} || true
          docker rm ${CONTAINER_NAME} || true
          docker run -d \
            --name ${CONTAINER_NAME} \
            --restart unless-stopped \
            -p 8080:8080 \
            ${IMAGE_URI}

      - name: Verify Application is Running
        run: |
          CONTAINER_NAME="my-app-service"          
          sleep 10
          IS_RUNNING=$(docker inspect --format='{{.State.Running}}' ${CONTAINER_NAME} 2>/dev/null || echo "false")
          if [ "$IS_RUNNING" != "true" ]; then
            echo "ERROR"
            docker logs ${CONTAINER_NAME}
            exit 1
          fi

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
          echo "HTTP response code: ${HTTP_CODE}"
